services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beacon-insight-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DATA_MODE=synthetic
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/beacon_insight
      - NATS_URL=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: beacon-insight-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=beacon_insight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: beacon-insight-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # NATS management/monitoring
    restart: unless-stopped

volumes:
  pgdata:

version: "1.0.0"
name: "fusion_parameters"
description: "Bayesian log-odds sensor fusion parameters and group capping configuration"

groups:
  GROUP_A_ELECTRONIC:
    name: "Electronic / RF Transceiver Sensors"
    cap: 4.5
    weight: 1.0
    modalities:
      - "RF"
      - "RECCO"
      - "MOBILE_RF"
  GROUP_B_SUBSURFACE:
    name: "Subsurface / Life-Sign Sensors"
    cap: 4.0
    weight: 0.95
    modalities:
      - "GPR"
      - "SEISMIC"
      - "ACOUSTIC"
  GROUP_C_SURFACE:
    name: "Surface / Visual Sensors"
    cap: 2.2
    weight: 0.6
    modalities:
      - "THERMAL"
      - "RGB"

temporal:
  window_passes: 3
  persistence_bonus: 0.8
  decay_penalty: 0.35
  detection_threshold: 0.5
